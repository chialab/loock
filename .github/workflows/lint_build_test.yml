name: Lint and Test
on:
  workflow_call:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: pnpm/setup@v2
        with:
          runtime: node@latest
          cache: true
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: true

      - name: Lint
        run: pnpm lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: pnpm/setup@v2
        with:
          runtime: node@latest
          cache: true
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: true

      - name: Run build script
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Loock
          path: dist

  test:
    name: Test Browsers
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 3
      matrix:
        browser:
          - 'chromium'
          - 'firefox'
          - 'webkit'
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: pnpm/setup@v2
        with:
          runtime: node@latest
          cache: true
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: true

      - name: Install browser
        run: pnpm playwright install --with-deps ${{ matrix.browser }}

      - name: Run tests
        run: pnpm test --project ${{ matrix.browser }}
